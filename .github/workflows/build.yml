name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Testes do CanopyKit
        run: swift test --package-path CanopyKit

      - name: Build do app
        run: |
          xcodebuild build \
            -project Canopy.xcodeproj \
            -scheme Canopy \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  perf:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Memória e CPU em cenários fixos
        run: scripts/benchmark.sh

      - name: Capturas da ilha em cada cenário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: build/benchmark/*.png
          if-no-files-found: ignore
